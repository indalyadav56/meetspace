logger:
  level: info

server:
  port: "8080"
  read_timeout: 15s
  write_timeout: 0s   # streaming endpoints (assistant SSE, websockets) manage their own deadlines
  idle_timeout: 60s

jwt:
  secret: ""          # set APP_JWT_SECRET
  issuer: "meetspace"
  access_token_ttl: 15m
  refresh_token_ttl: 720h   # 30 days

postgres:
  host: "localhost"
  port: 5432
  user: "meetspace"
  password: ""       # set APP_POSTGRES_PASSWORD
  database: "meetspace"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  host: "localhost"
  port: 6379
  db: 0
  dial_timeout: 3s
  read_timeout: 3s
  write_timeout: 3s
  pool_size: 20

livekit:
  url: "ws://localhost:7880"
  api_url: "http://localhost:7880"
  api_key: "devkey"
  api_secret: ""     # set APP_LIVEKIT_API_SECRET
  token_ttl: 6h

ai:
  gemini_api_key: ""   # set APP_AI_GEMINI_API_KEY to enable the assistant
  model: "gemini-3.5-flash"

media:
  storage: "minio"         # minio | filesystem (uses dir)
  dir: "./data/media"
  max_upload_mb: 500

# Object storage for clip and call recordings (MinIO or any S3-compatible store).
minio:
  endpoint: ""         # APP_MINIO_ENDPOINT, host:port
  access_key: ""             # APP_MINIO_ACCESS_KEY
  secret_key: ""             # APP_MINIO_SECRET_KEY
  bucket: "meetspace-media"
  use_ssl: true
  region: ""

web:
  url: "https://app.meetspace.example"
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:5174"
    - "http://localhost:3000"

resend:
  api_key: ""              # APP_RESEND_API_KEY
  from: ""                 # APP_RESEND_FROM, e.g. "Meetspace <noreply@yourdomain.com>" (verified domain)

smtp:
  host: ""
  port: 587
  user: ""
  password: ""
  from: ""

# Full-text search across tasks, docs, chat, clips and more.
opensearch:
  urls: []          # APP_OPENSEARCH_URLS, comma-separated
  username: ""
  password: ""
  index: "meetspace-search"

# Third-party integrations (GitHub). The key encrypts stored access tokens;
# set APP_INTEGRATIONS_ENCRYPTION_KEY to a long random string in production.
integrations:
  encryption_key: ""
