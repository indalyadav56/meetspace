logger:
  level: debug

server:
  port: "8080"
  read_timeout: 15s
  write_timeout: 0s   # streaming endpoints (assistant SSE, websockets) manage their own deadlines
  idle_timeout: 60s

jwt:
  secret: "dev-only-change-me"   # override with APP_JWT_SECRET
  issuer: "meetspace"
  access_token_ttl: 15m
  refresh_token_ttl: 720h   # 30 days

postgres:
  host: "localhost"
  port: 5432
  user: "meetspace"
  password: "meetspace"
  database: "meetspace"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  host: "localhost"
  port: 6379
  db: 0
  dial_timeout: 3s
  read_timeout: 3s
  write_timeout: 3s
  pool_size: 20

livekit:
  url: "ws://localhost:7880"
  api_url: "http://localhost:7880"
  api_key: "devkey"
  api_secret: "meetspace-dev-livekit-secret-0123456789"
  token_ttl: 6h

ai:
  gemini_api_key: ""   # set APP_AI_GEMINI_API_KEY to enable the assistant
  model: "gemini-3.5-flash"

media:
  dir: "./data/media"
  max_upload_mb: 500

web:
  url: "http://localhost:5173"
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:5174"
    - "http://localhost:3000"
