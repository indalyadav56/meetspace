logger:
  level: debug

server:
  port: "8080"
  read_timeout: 15s
  write_timeout: 0s   # streaming endpoints (assistant SSE, websockets) manage their own deadlines
  idle_timeout: 60s

jwt:
  secret: "dev-only-change-me"   # override with APP_JWT_SECRET
  issuer: "meetspace"
  access_token_ttl: 15m
  refresh_token_ttl: 720h   # 30 days

postgres:
  host: "localhost"
  port: 5432
  user: "meetspace"
  password: "meetspace"
  database: "meetspace"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  host: "localhost"
  port: 6379
  db: 0
  dial_timeout: 3s
  read_timeout: 3s
  write_timeout: 3s
  pool_size: 20

livekit:
  url: "ws://localhost:7880"
  api_url: "http://localhost:7880"
  api_key: "devkey"
  api_secret: "meetspace-dev-livekit-secret-0123456789"
  token_ttl: 6h

ai:
  gemini_api_key: ""   # set APP_AI_GEMINI_API_KEY to enable the assistant
  model: "gemini-3.5-flash"

media:
  storage: "minio"         # minio | filesystem (uses dir)
  dir: "./data/media"
  max_upload_mb: 500

# Object storage for clip and call recordings (MinIO or any S3-compatible store).
minio:
  endpoint: "localhost:9000"
  access_key: "meetspace"
  secret_key: "meetspace-dev-minio-secret"
  bucket: "meetspace-media"
  use_ssl: false
  region: ""

web:
  url: "http://localhost:5173"
  allowed_origins:
    - "http://localhost"
    - "http://localhost:5173"
    - "http://localhost:5174"
    - "http://localhost:3000"

# Transactional email (password resets, invites). Set APP_RESEND_API_KEY to send
# through Resend; without it (and without SMTP) emails are written to the log.
resend:
  api_key: ""              # APP_RESEND_API_KEY
  from: ""                 # APP_RESEND_FROM; default "Meetspace <onboarding@resend.dev>" (test only)

# Grievance officer shown on the Privacy Policy (India DPDP Act: people must be
# able to reach someone about their personal data).
privacy:
  grievance_name: "Grievance Officer"   # APP_PRIVACY_GRIEVANCE_NAME
  grievance_email: ""                   # APP_PRIVACY_GRIEVANCE_EMAIL, e.g. "privacy@yourcompany.com"
  grievance_address: ""                 # APP_PRIVACY_GRIEVANCE_ADDRESS, postal address (optional)

# Email-to-task: mail sent to <list token>@<domain> becomes a task.
inbound:
  domain: ""   # APP_INBOUND_DOMAIN, e.g. "in.yourcompany.com" (MX handled by your email provider)
  secret: ""   # APP_INBOUND_SECRET, the last part of the webhook URL

# Single sign-on. Callback URL to register with the provider:
#   <web.url>/api/v1/auth/oauth/<google|oidc>/callback
oauth:
  google_client_id: ""      # APP_OAUTH_GOOGLE_CLIENT_ID
  google_client_secret: ""  # APP_OAUTH_GOOGLE_CLIENT_SECRET
  oidc_name: ""             # e.g. "Okta"
  oidc_issuer: ""           # e.g. https://dev-123.okta.com
  oidc_client_id: ""
  oidc_client_secret: ""

# Optional alternative to Resend: any SMTP provider.
smtp:
  host: ""
  port: 587
  user: ""
  password: ""
  from: ""

# Full-text search across tasks, docs, chat, clips and more.
opensearch:
  urls:
    - "http://localhost:9200"
  username: ""
  password: ""
  index: "meetspace-search"

# Third-party integrations (GitHub). The key encrypts stored access tokens;
# set APP_INTEGRATIONS_ENCRYPTION_KEY to a long random string in production.
integrations:
  encryption_key: ""
