# Self-hosted LiveKit SFU for Meetspace calls (open source livekit-server, not LiveKit Cloud).
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Browsers on this machine reach the SFU through the published ports.
  # In production set use_external_ip: true (or node_ip) instead.
  node_ip: 127.0.0.1
  use_external_ip: false
keys:
  devkey: meetspace-dev-livekit-secret-0123456789
webhook:
  api_key: devkey
  urls:
    - http://backend:8080/api/v1/livekit/webhook
room:
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info
