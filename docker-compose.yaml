services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: meetspace
      POSTGRES_PASSWORD: meetspace
      POSTGRES_DB: meetspace
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetspace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
